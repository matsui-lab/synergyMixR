on:
  push:
    branches: [main, master, dev/*]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        r: ['release']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::lintr, any::covr, any::testthat
          needs: check

      - name: Install system dependencies on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libarmadillo-dev

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Run lintr
        run: |
          lintr::lint_package()
        shell: Rscript {0}
        continue-on-error: true

      - name: Test vignette reproduction
        run: |
          if (file.exists("vignettes/demo_reproduction.Rmd")) {
            rmarkdown::render("vignettes/demo_reproduction.Rmd")
          }
        shell: Rscript {0}
        continue-on-error: true

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}
        continue-on-error: true
